spring:
  application:
    name: klage-notifications-api
  web:
    error:
      include-message: never
      include-stacktrace: never

  datasource:
    url: ${NAIS_DATABASE_KLAGE_NOTIFICATIONS_API_KLAGE_NOTIFICATIONS_API_JDBC_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    schemas: flyway_history_schema,klage
    connect-retries: 2
    clean-disabled: true

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080


NOTIFICATION_EVENTS_TOPIC: klage.klage-notification-events.v1
NOTIFICATION_INTERNAL_EVENTS_TOPIC: klage.klage-notification-internal-events.v1
NOTIFICATION_INTERNAL_CHANGE_EVENTS_TOPIC: klage.klage-notification-internal-change-events.v1
NOTIFICATION_INTERNAL_SYSTEM_EVENTS_TOPIC: klage.klage-notification-internal-system-events.v1

# Dead Letter Queue Configuration
dlq:
  max-retry-attempts: 3
  retry-delay-seconds: 5